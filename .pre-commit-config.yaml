repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: privacy-sync
        name: Registry Privacy Sync
        entry: python .rokct/scripts/privacy/index.py
        language: system
        files: ^.rokct/recipients/.*\.md$
        pass_filenames: false
