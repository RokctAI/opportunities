repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: verify-sources
        name: Verify Sources
        entry: python3 .rokct/scripts/equity/verify_sources.py
        language: system
        files: ^(01_equity|02_grants)/.*\.md$
        pass_filenames: true
