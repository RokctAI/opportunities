name: "Privacy: Auto-Fix"

on:
  pull_request:
    paths:
      - '.rokct/recipients/*.md'

jobs:
  privacy-auto-fix:
    if: github.event.pull_request.head.repo.fork == false
    uses: RokctAI/shared-workflows/.github/workflows/universal-privacy.yml@main
    with:
      mode: 'fix'
      script-path: 'scripts/privacy/index.py'
      commit-pattern: '.rokct/recipients/*.md'
    secrets:
      EMAIL_ENCRYPTION_KEY: ${{ secrets.EMAIL_ENCRYPTION_KEY }}
