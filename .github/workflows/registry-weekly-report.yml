name: "Registry: Weekly Friday Report"

on:
  schedule:
    - cron: '0 20 * * 5' # Friday 10 PM SAST / 8 PM UTC
  workflow_dispatch:

jobs:
  send_report:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Fetch Production Environment from Monorepo
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
          mkdir -p .env
          echo "🔍 Fetching production.env from RokctAI/Monorepo..."
          gh api /repos/RokctAI/Monorepo/contents/.env/production.env -H "Accept: application/vnd.github.v3.raw" > .env/production.env
          echo "✅ .env/production.env written."

      - name: Send Reports
        run: |
          python .rokct/skills/agent_delegation/scripts/send_registry_emails.py
