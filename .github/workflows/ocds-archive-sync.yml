name: "Opportunities: OCDS Archive Sync"

# Keeps the full eTenders OCDS release archive current using single-release
# ID enumeration only. The list endpoint's pagination silently drops
# records and must not be used.
#
# The data does NOT live in git, so the repository does not grow: it lives
# in GitHub Release assets, overwritten in place each run (see
# ocds/release_assets.sh). One release per year (`ocds-YYYY`), a
# pre-release while the year runs and a full release once it ends, plus an
# `ocds-index` pre-release for the manifest, ocid index and legacy records.
#
# Light run (Tue + Fri): new IDs since the last max, the top of the last
#   range (IDs allocated before publication), and retries of IDs we hold
#   no snapshot for.
# Full run (1st of the month): additionally re-fetches every release dated
#   in the last 365 days, so awards / contracts / amendments land.

on:
  schedule:
    - cron: '0 2 * * 2,5' # light: Tue + Fri 02:00 UTC (04:00 SAST)
    - cron: '0 3 1 * *'   # full: 1st of each month 03:00 UTC
  workflow_dispatch:
    inputs:
      refetch_days:
        description: "Re-fetch window in days for late awards (0 = light run)"
        required: false
        default: "0"

env:
  DATA: ocds-data

jobs:
  sync:
    runs-on: ubuntu-latest
    # A full run is ~35k requests; the API's persistent HTTP 500s and a
    # flaky edge make it slow (~75 min observed 2026-10-30).
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
    concurrency:
      group: ocds-archive-sync
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history only matters for the one-time bootstrap below.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download archive from release assets
        run: bash ocds/release_assets.sh download "$DATA"

      - name: Sync OCDS archive
        env:
          REFETCH_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.refetch_days || (github.event.schedule == '0 3 1 * *' && '365' || '0') }}
        run: |
          python ocds/sync_ocds.py --archive-dir "$DATA" \
            --refetch-days "$REFETCH_DAYS" --concurrency 16 \
            --new-buyers-out new_buyers.json

      - name: Upload changed assets
        run: |
          bash ocds/release_assets.sh upload "$DATA"
          python -c "import json; m=json.load(open('$DATA/manifest.json')); print('releases:', m['unique_release_count'], '| max ID:', m['max_id_probed'], '| pending retry:', m['pending_retry_count'])"

      # One issue per new buyer, labelled new-buyer + needs-quirks, with a
      # Part A comment (buyer data from the archive) that every later sync
      # refreshes in place while the issue is open. See ocds/buyer_issues.py.
      - name: Open / refresh new-buyer issues
        run: |
          python ocds/buyer_issues.py --archive-dir "$DATA" \
            --new-buyers new_buyers.json

      # Part B: read each new buyer's latest tender packs, run the fixed-rule
      # scan and post a Part B comment (ocds/buyer_quirks.py). No AI is wired
      # yet, so the comment carries a checklist for a person to finish. To add
      # one, pass GROQ_API_KEY (+ optional QUIRKS_MODEL), ANTHROPIC_API_KEY or
      # QUIRKS_AI_CMD here from repo secrets.
      - name: Part B pack scan for new-buyer issues
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr >/dev/null
          python ocds/buyer_quirks.py --archive-dir "$DATA" --max-issues 3

      - name: Keep Part B prompts for people or any AI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buyer-quirks
          path: buyer-quirks/
          if-no-files-found: ignore
          retention-days: 30
