name: Link Checker

on:
  schedule:
    - cron: '30 2 * * 0' # Weekly on Sunday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Initialize Protocol Skills
        run: |
          python .rokct/initiate.py

      - name: Run link audit
        run: |
          python .rokct/skills/.rok/opportunities_registry/scripts/ci/check_links.py

      - name: Run registry orchestrator sync
        run: |
          python .rokct/skills/.rok/opportunities_registry/scripts/registry_orchestrator/index.py

      - name: End Protocol
        run: |
          if [ -f ".rokct/end_protocol.py" ]; then
            python .rokct/end_protocol.py
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all potential modifications (cards, JSON metadata, readmes, and task queues)
          git add .
          
          # Only commit and push if there are actual staged modifications
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated link verification audit and sync [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi