name: "Agent: Automated Git Delegation"

on:
  push:
    paths:
      - '.rokct/agent/queue/*.json'
    branches:
      - main
  schedule:
    - cron: '0 20 * * *' # 10 PM SAST / 8 PM UTC Daily
  workflow_dispatch:

concurrency:
  group: agent-delegation
  cancel-in-progress: false

jobs:
  agent-run:
    uses: RokctAI/shared-workflows/.github/workflows/universal-agent.yml@main
    with:
      mode: 'run'
    secrets:
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      GROQ_API_KEY: ${{ secrets.AGENT_API_KEY }}
      MONOREPO_PAT: ${{ secrets.MONOREPO_PAT }}
