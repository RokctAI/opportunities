name: "Agent: Automated Git Delegation"

on:
  push:
    paths:
      - '.rokct/agent/queue/*.json'
    branches:
      - main
  schedule:
    - cron: '0 20 * * *' # 10 PM SAST / 8 PM UTC Daily
  workflow_dispatch:

concurrency:
  group: agent-delegation
  cancel-in-progress: false

permissions: write-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  delegate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Fetch Production Environment from Monorepo
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_PAT }}
        run: |
          mkdir -p .env
          echo "🔍 Fetching production.env from RokctAI/Monorepo..."
          gh api /repos/RokctAI/Monorepo/contents/.env/production.env -H "Accept: application/vnd.github.v3.raw" > .env/production.env
          echo "✅ .env/production.env written."

      - name: Process Queue
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          # 1. Determine which files to check
          if [ "${{ github.event_name }}" == "push" ]; then
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep '.rokct/agent/queue/.*.json' || true)
          else
            FILES=$(ls .rokct/agent/queue/*.json || true)
          fi
          
          if [ -z "$FILES" ]; then
            echo "ℹ️ No task files found to process."
            exit 0
          fi
          
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          HAS_UPDATES=false
          
          for FILE in $FILES; do
            if [ ! -f "$FILE" ]; then continue; fi
            
            echo "📂 Analyzing: $FILE"
            
            # Check for scheduled_at
            SCHEDULED_AT=$(jq -r '.scheduled_at // empty' "$FILE")
            if [ ! -z "$SCHEDULED_AT" ] && [[ "$CURRENT_TIME" < "$SCHEDULED_AT" ]]; then
              echo "⏳ Task is scheduled for $SCHEDULED_AT. Skipping (Current: $CURRENT_TIME)."
              continue
            fi

            # New: "Immediate" check for initial push
            IMMEDIATE=$(jq -r '.immediate // "true"' "$FILE")
            if [ -z "$SCHEDULED_AT" ] && [ "$IMMEDIATE" == "false" ]; then
               echo "🕒 Task marked as immediate:false with no schedule. Setting first run to tonight (20:00 UTC)."
               jq --arg next "$(date -u -d "20:00" +"%Y-%m-%dT%H:%M:%SZ")" '.scheduled_at = $next' "$FILE" > tmp.json && mv tmp.json "$FILE"
               HAS_UPDATES=true
               continue
            fi
            
            REPO=$(jq -r '.repo' "$FILE")
            PROMPT=$(jq -r '.prompt' "$FILE")
            BRANCH=$(jq -r '.branch // "main"' "$FILE")
            TITLE=$(jq -r '.title // "AI-Automation"' "$FILE")
            AUTOMATION_MODE=$(jq -r '.automation_mode // "AUTO_CREATE_PR"' "$FILE")
            RECURRENCE=$(jq -r '.recurrence // "Once"' "$FILE")
            
            echo "🚀 Delegating $TITLE for $REPO..."
            
            # Run the delegation AND only proceed if it returns 0 (Success)
            if python .rokct/skills/agent_delegation/scripts/delegate_to_agent.py create \
              --repo "sources/github/$REPO" \
              --prompt "$PROMPT" \
              --branch "$BRANCH" \
              --title "$TITLE" \
              --automation-mode "$AUTOMATION_MODE"; then
              
              echo "✅ Delegation successful. Processing outcome..."
              
              # 2. Handle Recurrence & Cleanup
              if [ "$RECURRENCE" == "Daily" ]; then
                NEXT_RUN=$(date -u -d "tomorrow 20:00" +"%Y-%m-%dT%H:%M:%SZ")
                echo "🔄 Rescheduling Daily task for $NEXT_RUN"
                jq --arg next "$NEXT_RUN" '.scheduled_at = $next' "$FILE" > tmp.json && mv tmp.json "$FILE"
                HAS_UPDATES=true
              elif [ "$RECURRENCE" == "Weekly" ]; then
                NEXT_RUN=$(date -u -d "next week 20:00" +"%Y-%m-%dT%H:%M:%SZ")
                echo "🔄 Rescheduling Weekly task for $NEXT_RUN"
                jq --arg next "$NEXT_RUN" '.scheduled_at = $next' "$FILE" > tmp.json && mv tmp.json "$FILE"
                HAS_UPDATES=true
              else
                # Once-off: Move to completed
                mkdir -p .rokct/agent/completed
                mv "$FILE" ".rokct/agent/completed/$(basename "$FILE")"
                HAS_UPDATES=true
              fi
            else
              echo "❌ Delegation failed. Task will stay in queue for retry."
            fi
          done

          # 3. Sync updates back to Monorepo if any
          if [ "$HAS_UPDATES" == "true" ]; then
            git config --global user.name "google-labs-jules[bot]"
            git config --global user.email "161369871+google-labs-jules[bot]@users.noreply.github.com"
            git add .
            git commit -m "🤖 [CI] Update Agent Task Queue (Rescheduled/Completed) [skip ci]"
            # Use rebase to prevent conflicts if user edited locally
            git pull --rebase origin main
            git push origin main
          fi