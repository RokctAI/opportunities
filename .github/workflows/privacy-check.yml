name: "Privacy: Enforcement Check"

on:
  push:
    paths:
      - '.rokct/recipients/*.md'
  pull_request:
    paths:
      - '.rokct/recipients/*.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install python-dotenv pycryptodome

      - name: Run Privacy Enforcement Check
        run: |
          python .rokct/scripts/privacy/index.py --check
