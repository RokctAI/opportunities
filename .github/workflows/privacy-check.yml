name: "Privacy: Enforcement Check"

on:
  push:
    paths:
      - '.rokct/recipients/*.md'
  pull_request:
    paths:
      - '.rokct/recipients/*.md'

jobs:
  privacy-check:
    uses: RokctAI/shared-workflows/.github/workflows/universal-privacy.yml@main
    with:
      mode: 'check'
      script-path: 'scripts/privacy/index.py'
