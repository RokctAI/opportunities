name: "Opportunities: Universal Sync Engine"

on:
  push:
    branches:
      - main
    paths:
      # Only human/external edits to equity & grants trigger a sync.
      # 03_tenders/** is intentionally excluded — tenders are written
      # exclusively by this bot (with [skip ci]) or fetched on schedule.
      - '01_equity/**'
      - '02_grants/**'
  schedule:
    - cron: '0 0 * * 1' # Every Monday at Midnight (Heavy Fetch)
  workflow_dispatch:

jobs:
  sync_and_orchestrate:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests python-dotenv beautifulsoup4 lxml pdfplumber

      - name: 🏗️ Run Heavy Sync (Scrapers + Maintenance)
        # Runs on schedule, or dispatch for testing
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python .rokct/scripts/tenders/index.py
          python .rokct/scripts/grants/scrapers/f4c.py
          python .rokct/scripts/tenders/enrichment/pdf_to_md.py
          python .rokct/scripts/tenders/enrichment/extract_requirements.py
          python .rokct/scripts/maintenance/index.py

      - name: 📊 Run Fast Refresh (Orchestrator Only)
        # ALWAYS runs to keep JSON, Tags, and Dashboard in sync
        run: python .rokct/scripts/registry_orchestrator/index.py

      - name: 🧱 Satisfy Jekyll Ghost
        run: mkdir -p docs && touch docs/.gitkeep

      - name: 🚀 Commit and Push Updates
        run: |
          git config --global user.name "rokctbot[bot]"
          git config --global user.email "rokctbot@users.noreply.github.com"
          git add 03_tenders/ README.md published/api/meta.json .rokct/agent/todo.json 01_equity/*.md docs/.gitkeep .nojekyll
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: pdf extraction + folder migration [skip ci]"
            git push origin main
          fi
