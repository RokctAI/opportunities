name: "Opportunities: Universal Sync Engine"

on:
  push:
    branches:
      - main
    paths:
      # Only human/external edits to equity & grants trigger a sync.
      # 03_tenders/** is intentionally excluded — tenders are written
      # exclusively by this bot (with [skip ci]) or fetched on schedule.
      - '01_equity/**'
      - '02_grants/**'
  schedule:
    - cron: '0 0 * * 1' # Every Monday at Midnight (Heavy Fetch)
  workflow_dispatch:

jobs:
  sync_and_orchestrate:
    runs-on: ubuntu-latest
    # The whole job must finish comfortably inside GitHub's 6-hour default;
    # the 2026-07-27 / 2026-08-03 runs died at that default limit mid-
    # enrichment ("Error: The operation was canceled.") before anything
    # was committed, discarding a fully successful OCDS sync.
    timeout-minutes: 300
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests python-dotenv beautifulsoup4 lxml pdfplumber

      - name: Initialize Protocol Skills
        run: |
          python .rokct/initiate.py

      - name: 🏗️ Run Heavy Sync (Scrapers + Purge)
        # Runs on schedule, or dispatch for testing.
        # Maintenance/purge now runs HERE, before enrichment, so expired
        # entries are removed even if enrichment later times out.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python .rokct/skills/.rok/opportunities_registry/scripts/tenders/index.py
          python .rokct/skills/.rok/opportunities_registry/scripts/grants/scrapers/f4c.py
          python .rokct/skills/.rok/opportunities_registry/scripts/equity/equity_sync.py
          python .rokct/skills/.rok/opportunities_registry/scripts/maintenance/index.py

      - name: 🚀 Commit Sync Results (before enrichment)
        # Fetched tenders + purge results are pushed BEFORE enrichment
        # starts, so a canceled/timed-out enrichment can never throw the
        # sync away again.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "rokctbot[bot]"
          git config --global user.email "rokctbot@users.noreply.github.com"
          git add 03_tenders/ 01_equity/*.md 02_grants/ .rokct/agent/todo.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: tender sync + purge [skip ci]"
            for _ in 1 2 3; do
              git push origin main && break
              git pull --rebase origin main || { git rebase --abort || true; exit 1; }
              sleep $((RANDOM % 3 + 1))
            done
          fi

      - name: 📄 Enrich Tenders (PDF -> Markdown)
        # Bounded: a hung/oversized PDF batch is cut off by the step
        # timeout and must not fail the job — the sync is already pushed.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 60
        continue-on-error: true
        run: python .rokct/skills/.rok/opportunities_registry/scripts/tenders/enrichment/pdf_to_md.py

      - name: 🚀 Commit Enrichment Progress (PDF extraction)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git add 03_tenders/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: pdf extraction progress [skip ci]"
            for _ in 1 2 3; do
              git push origin main && break
              git pull --rebase origin main || { git rebase --abort || true; exit 1; }
              sleep $((RANDOM % 3 + 1))
            done
          fi

      - name: 📄 Enrich Tenders (Requirements Extraction)
        # Root cause of the canceled runs: this script misread the
        # committed dict-format todo.json as "empty" and scanned the
        # full corpus. Fixed protocol-side (accepts the dict; bounded
        # 200-card fallback kept as a safety net); the step timeout
        # is a second line of defense.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 60
        continue-on-error: true
        run: python .rokct/skills/.rok/opportunities_registry/scripts/tenders/enrichment/extract_requirements.py

      - name: 📊 Run Fast Refresh (Orchestrator Only)
        # ALWAYS runs to keep JSON, Tags, and Dashboard in sync
        run: python .rokct/skills/.rok/opportunities_registry/scripts/registry_orchestrator/index.py

      - name: 🧱 Satisfy Jekyll Ghost
        run: mkdir -p docs && touch docs/.gitkeep

      - name: 🚀 Commit and Push Updates
        run: |
          git config --global user.name "rokctbot[bot]"
          git config --global user.email "rokctbot@users.noreply.github.com"
          git add 03_tenders/ README.md published/api/meta.json published/api/tenders.json .rokct/agent/todo.json 01_equity/*.md 02_grants/ docs/.gitkeep .nojekyll
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: pdf extraction + folder migration [skip ci]"
            for _ in 1 2 3; do
              git push origin main && break
              git pull --rebase origin main || { git rebase --abort || true; exit 1; }
              sleep $((RANDOM % 3 + 1))
            done
          fi
