name: "Registry: Sync to Excel"

on:
  push:
    paths:
      - 'opportunities/01_equity/*.md'
      - 'opportunities/02_grants/*.md'
    branches:
      - main

jobs:
  sync_excel:
    runs-on: ubuntu-latest
    permissions: write-all
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Run Markdown to Excel Sync
        run: python .rokct/skills/agent_delegation/scripts/md_to_excel.py

      - name: Commit and Push Excel Registries
        run: |
          git config --global user.name "google-labs-jules[bot]"
          git config --global user.email "161369871+google-labs-jules[bot]@users.noreply.github.com"
          git add opportunities/published/*.xlsx
          if git diff --staged --quiet; then
            echo "No changes in Excel registries."
          else
            git commit -m "docs: auto-sync category-specific registries to excel [skip ci]"
            git push origin main
          fi
