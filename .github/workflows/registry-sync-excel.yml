name: "Registry: Sync to Excel"

on:
  push:
    paths:
      - '01_equity/*.md'
      - '02_grants/*.md'
      - '03_tenders/*.md'
    branches:
      - main
  workflow_dispatch:

jobs:
  sync_excel:
    runs-on: ubuntu-latest
    permissions: write-all
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl reportlab

      - name: Run Markdown to Excel/PDF Sync
        run: python .rokct/skills/agent_delegation/scripts/md_to_excel.py

      - name: Commit and Push Excel/PDF Registries
        run: |
          git config --global user.name "google-labs-jules[bot]"
          git config --global user.email "161369871+google-labs-jules[bot]@users.noreply.github.com"
          git add published/*.xlsx published/*.pdf
          if git diff --staged --quiet; then
            echo "No changes in Excel registries."
          else
            git commit -m "docs: auto-sync category-specific registries to excel [skip ci]"
            git push origin main
          fi