# .github/workflows/agent-cleanup.yml
name: "Agent: Cleanup & Sync"

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract Session ID
        id: extract_id
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          if [[ $BRANCH_NAME =~ ([0-9]{18,20}) ]]; then
            SESSION_ID="${BASH_REMATCH[1]}"
            echo "session_id=$SESSION_ID" >> $GITHUB_OUTPUT
            echo "✅ Found Agent Session ID: $SESSION_ID"
          else
            echo "ℹ️ No Agent Session ID in branch: $BRANCH_NAME"
            exit 0
          fi
          
      - name: Delete Session
        if: steps.extract_id.outputs.session_id != ''
        env:
          AGENT_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          python .rokct/skills/agent_delegation/scripts/delegate_to_agent.py delete \
            --id "${{ steps.extract_id.outputs.session_id }}"

      - name: Sync to Monorepo Memory
        if: steps.extract_id.outputs.session_id != ''
        run: |
          # Logic to append PR title and link to memory.md
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          DATE=$(date +'%Y-%m-%d')
          
          echo "* **[$DATE]** - Completed Agent Task: $PR_TITLE ($PR_URL)" >> .rokct/memory.md
          
          # Move task from queue to completed if it exists
          # (Note: In actual multi-repo setups, this would require cross-repo file checks)
          # For now, we log the success.
          
      - name: Commit Knowledge Updates
        if: steps.extract_id.outputs.session_id != ''
        run: |
          git config user.name "Agent-Manager"
          git config user.email "agent@rokct.ai"
          git add .rokct/memory.md
          git commit -m "🤖 docs: sync agent memory after PR merge" || echo "No changes to commit"
          git push
