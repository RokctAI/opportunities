name: "Registry: Sync Tenders from API"

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  workflow_dispatch:

jobs:
  sync_tenders:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests python-dotenv pycryptodome

      - name: Run Tender Sync
        run: python .rokct/skills/agent_delegation/scripts/tender_sync_api.py

      - name: Global Health Check
        run: python .rokct/skills/agent_delegation/scripts/check_health.py

      - name: Update README Dashboard
        run: python .rokct/skills/agent_delegation/scripts/update_dashboard.py

      - name: Generate Response Kits
        run: python .rokct/skills/agent_delegation/scripts/response_kits.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "google-labs-jules[bot]"
          git config --global user.email "161369871+google-labs-jules[bot]@users.noreply.github.com"
          git add 01_equity/*.md 02_grants/*.md 03_tenders/*.md README.md .rokct/agent/queue/*.json responses/
          if git diff --staged --quiet; then
            echo "No updates to commit."
          else
            git commit -m "chore: sync registries, queue AI analysis, and update dashboard [skip ci]"
            git push origin main
          fi