name: "Registry: Sync Tenders from API"

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch:

jobs:
  sync_tenders:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Tender Sync
        run: python .rokct/skills/agent_delegation/scripts/tender_sync_api.py

      - name: Commit and Push New Tenders
        run: |
          git config --global user.name "google-labs-jules[bot]"
          git config --global user.email "161369871+google-labs-jules[bot]@users.noreply.github.com"
          git add 03_tenders/*.md
          if git diff --staged --quiet; then
            echo "No new tenders found."
          else
            git commit -m "chore: auto-sync new tenders from eTenders API [skip ci]"
            git push origin main
          fi
